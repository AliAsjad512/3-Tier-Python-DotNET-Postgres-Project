name: projectops-dotnet

services:

  postgres:

    image: postgres:16-alpine

    environment:

      POSTGRES_DB: ${POSTGRES_DB:-projectops}

      POSTGRES_USER: ${POSTGRES_USER:-projectops}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-projectops123}

    volumes:

      - postgres-data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-projectops} -d ${POSTGRES_DB:-projectops}"
        ]

      interval: 5s

      timeout: 5s

      retries: 20

      start_period: 10s

    networks:

      - database-network

    restart: unless-stopped


  backend:

    build:

      context: ./backend-dotnet

      dockerfile: Dockerfile

    environment:

      ASPNETCORE_URLS: http://+:8080

      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-projectops};Username=${POSTGRES_USER:-projectops};Password=${POSTGRES_PASSWORD:-projectops123}

    depends_on:

      postgres:

        condition: service_healthy

    networks:

      - application-network

      - database-network

    read_only: true

    tmpfs:

      - /tmp

    cap_drop:

      - ALL

    security_opt:

      - no-new-privileges:true

    restart: unless-stopped


  frontend:

    build:

      context: ./frontend-python

      dockerfile: Dockerfile

    environment:

      BACKEND_URL: http://backend:8080

      PORT: 5000

      FLASK_ENV: production

    ports:

      - "5000:5000"

    depends_on:

      - backend

    networks:

      - application-network

    read_only: true

    tmpfs:

      - /tmp

    cap_drop:

      - ALL

    security_opt:

      - no-new-privileges:true

    restart: unless-stopped


volumes:

  postgres-data:


networks:

  application-network:

  database-network:

    internal: true
